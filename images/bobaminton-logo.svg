<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
  <!-- Boba Cup -->
  <g transform="translate(10, 8)">
    <!-- Cup body -->
    <path d="M15 25 L12 60 C12 65 18 68 25 68 C32 68 38 65 38 60 L35 25 Z" fill="#7EBEC5" opacity="0.9"/>
    <!-- Cup lid -->
    <rect x="10" y="22" width="30" height="5" rx="2" fill="#7EBEC5"/>
    <!-- Straw -->
    <rect x="22" y="5" width="4" height="25" rx="2" fill="#a8dce2" transform="rotate(-10, 24, 17)"/>
    <!-- Boba pearls -->
    <circle cx="20" cy="55" r="3" fill="#0f0f23" opacity="0.6"/>
    <circle cx="28" cy="58" r="3" fill="#0f0f23" opacity="0.6"/>
    <circle cx="24" cy="52" r="3" fill="#0f0f23" opacity="0.6"/>
    <circle cx="18" cy="60" r="2.5" fill="#0f0f23" opacity="0.5"/>
    <circle cx="30" cy="54" r="2.5" fill="#0f0f23" opacity="0.5"/>
  </g>
  <!-- Shuttlecock -->
  <g transform="translate(42, 12)">
    <!-- Cork base -->
    <ellipse cx="8" cy="50" rx="6" ry="7" fill="#e8dcc8"/>
    <!-- Feathers -->
    <path d="M8 45 L2 15 C2 12 5 10 8 10 C11 10 14 12 14 15 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M8 45 L-2 20 C-3 17 0 14 3 14" fill="#f0f0f0" opacity="0.7"/>
    <path d="M8 45 L18 20 C19 17 16 14 13 14" fill="#f0f0f0" opacity="0.7"/>
  </g>
  <!-- Text: BOBAMINTON -->
  <text x="85" y="55" font-family="'Pacifico', 'Segoe UI', cursive" font-size="36" fill="#ffffff" font-weight="400">Bobaminton</text>
</svg>
